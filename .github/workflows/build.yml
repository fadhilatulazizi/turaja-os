name: Build Turaja OS ISO

on:
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" manual
  push:
    branches:
      - main

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Pasang Dependensi Kompilasi ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools squashfs-tools

      - name: Eksekusi Skrip Builder
        run: |
          chmod +x build_turaja_ready.sh
          sudo ./build_turaja_ready.sh

      - name: Upload Hasil ISO ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TurajaOS-Installer
          path: /tmp/output_iso/*.iso
          retention-days: 7
